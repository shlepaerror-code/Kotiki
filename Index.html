<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Милый котик</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Экран с котиком -->
    <div id="catScreen">
        <!-- Замени ссылку на картинку милого котика -->
        <img id="catImage" src="https://cataas.com/cat" alt="Милый котик">
        <h2>Поставь лайк котику!</h2>
        <button id="likeBtn">❤️ ЛАЙК</button>
    </div>

    <!-- Экран с вирусом (скрыт по умолчанию) -->
    <div id="virusScreen" style="display: none;">
        <div id="terminal"></div>
    </div>

    <!-- Аудио (замени ссылку на звук) -->
    <audio id="alarm" src="https://www.soundjay.com/buttons/sounds/button-09.mp3" loop></audio>

    <script src="script.js"></script>
</body>
</html>
